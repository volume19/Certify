[package]
name = "certify"
version = "2.0.0"
edition = "2021"
authors = ["Rust Port Project"]
license = "MIT"
description = "Active Directory Certificate Services enumeration and security auditing tool (Rust port)"
repository = "https://github.com/GhostPack/Certify"
readme = "README.md"

[lib]
name = "certify"
path = "src/lib.rs"

[[bin]]
name = "certify"
path = "src/main.rs"

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
regex = "1.10"
uuid = { version = "1.11", features = ["v4"] }
bitflags = "2.4"
ldap3 = "0.11"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
